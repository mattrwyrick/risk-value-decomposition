{% include '/layout/top.html' %}
{% block content %}

<div class="container mt-4">
    <div class="row flex-row full-height">
        <div class="col-md-3">
            <div class="card shadow-lg full-height">
                <div class="card-body">
                    <h2 class="card-title">Call Input</h2>
                    <form action="/options/calls" method="post">
                        <div class="form-group">
                            <label for="ticker">Stock Ticker:</label>
                            <input type="text" class="form-control" id="ticker" name="ticker" value="{{ ticker }}">
                        </div>
                        <div class="form-group">
                            <label for="strike_price">Strike Price:</label>
                            <input type="number" class="form-control" id="strike_price" name="strike_price" value="{{ strike_price }}">
                        </div>
                        <div class="form-group">
                            <label for="start_date">Start Date:</label>
                            <input type="date" class="form-control" id="start_date" name="start_date" value="{{ start_date }}">
                        </div>
                        <div class="form-group">
                            <label for="days_to_expiration">Days to Expiration:</label>
                            <input type="number" class="form-control" id="days_to_expiration" name="time_to_exp" value="{{ time_to_exp }}">
                        </div>
                        <div class="form-group">
                            <label for="risk_free_rate">Risk-Free Rate (%):</label>
                            <input type="number" step="0.0001" class="form-control" id="risk_free_rate" name="risk_free_rate" value="{{ risk_free_rate }}">
                        </div>
                        <div class="form-group">
                            <button type="submit" style="width:100%" class="btn btn-primary">Process</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
        <div class="col-md-9 d-flex flex-column">
            <div class="card shadow-lg full-height">
                <div class="card-body d-flex flex-column">
                    <h2 class="card-title">Decomposition</h2>
                    <ul class="nav nav-tabs" id="analysisTabs" role="tablist">
                        <li class="nav-item">
                            <a class="nav-link active" id="report-tab" data-toggle="tab" href="#report" role="tab" aria-controls="report" aria-selected="true">Stock and Strike</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" id="stock-tab" data-toggle="tab" href="#stock" role="tab" aria-controls="stock" aria-selected="false">Greeks</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" id="decomposition-tab" data-toggle="tab" href="#decomposition" role="tab" aria-controls="decomposition" aria-selected="false">Volatility</a>
                        </li>
                    </ul>
                    <div class="tab-content flex-grow-1" id="analysisTabsContent">
                        <div class="tab-pane fade show active chart-container" id="report" role="tabpanel" aria-labelledby="report-tab">
                            <div id="reportDiv" class="p-3">
                                <div id="pieChartDiv" class="mb-4 text-center">
                                    {{ pie_chart | safe }}
                                </div>
                            </div>
                        </div>
                        <div class="tab-pane fade chart-container" id="stock" role="tabpanel" aria-labelledby="stock-tab">
                            <div id="stockChartDiv">
                                {{ area_chart | safe }}
                            </div>
                        </div>
                        <div class="tab-pane fade chart-container" id="decomposition" role="tabpanel" aria-labelledby="decomposition-tab">
                            <div id="decompositionChartDiv" class="hidden">
                                {{ line_chart | safe }}
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const selectedOption = "{{ time_choice }}";
    const dropdown = document.getElementById('time_choice');
    dropdown.value = selectedOption;
</script>


{% endblock %}
{% include '/layout/bottom.html' %}

<style>
    .financial-report-explanation {
        background-color: #f8f9fa;
        padding: 20px;
        border-radius: 5px;
        border: 1px solid #ddd;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        font-family: Georgia, serif;
        margin-top: 30px;
    }

    .financial-report-explanation h4 {
        font-size: 1.25rem;
        margin-bottom: 15px;
        color: #343a40;
    }

    .financial-report-explanation p {
        line-height: 1.6;
        font-size: 1rem;
        color: #495057;
    }

    .financial-report-explanation p.text-muted {
        color: #6c757d;
    }

    .financial-report-explanation pre {
        white-space: pre-wrap;
        background-color: #e9ecef;
        padding: 15px;
        border-radius: 5px;
        font-size: 0.95rem;
        font-family: Consolas, 'Courier New', monospace;
    }
</style>
